name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Safety guards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No `pip install` step on purpose: tools/guards.py is stdlib-only, so this
      # job answers "did this PR widen the safety envelope?" in seconds, before any
      # dependency has been resolved. It is the machine-checked version of the
      # promises README.md and docs/safety.md only make in prose.
      - name: Run the guards
        run: python tools/guards.py

  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # No `playwright install` here: the test suite is fully offline and uses a
      # fake LinkedInService, so downloading Chromium would add minutes for nothing.

      - name: Lint
        run: ruff check --output-format=github .

      - name: Type check
        # Advisory. Playwright and SQLAlchemy typing produce noise that is not
        # worth failing a build over, but the output is still worth reading.
        continue-on-error: true
        run: mypy backend/app

      - name: Tests
        env:
          # Deterministic, throwaway values so Settings never falls back to a
          # per-process random key mid-suite.
          SECRET_KEY: "ci-secret-key-not-used-anywhere-else"
          ENCRYPTION_KEY: "ci-encryption-key-not-used-anywhere-else"
          # Quoted: a plain scalar ending in ':' parses as a mapping key.
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        # Coverage is reported, not enforced: a threshold here would push people
        # to test the easy modules, and the modules that matter are the ones the
        # guards job already pins down.
        run: pytest -q --cov=backend/app --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Tests
        working-directory: frontend
        # `--run` keeps vitest from dropping into its interactive watch mode.
        run: npm test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build-only: no container is started and nothing is pushed. This catches
      # a Dockerfile broken by a dependency or layout change before a user does.
      - name: Build the image
        run: docker build -t linkedin-auto-apply:ci -f docker/Dockerfile .
