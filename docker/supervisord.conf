; Four long-running processes:
;   xvfb      a virtual X display on :99 for the headed Chromium
;   x11vnc    exposes that display over VNC, bound to localhost only
;   novnc     websockify bridge that serves the browser-based VNC client on 6080
;   uvicorn   the application itself on 8000
;
; Everything logs to stdout/stderr so `docker compose logs` is the single place
; to look, and everything restarts on its own if it dies.

[supervisord]
nodaemon=true
user=appuser
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp -dpi 96
priority=10
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -localhost keeps the raw VNC port unreachable from outside the container; the
; only way in is through websockify on 6080. -nopw is safe for the same reason:
; do not publish port 5900.
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -localhost -nopw
    -rfbport 5900 -noxdamage -noxrecord -noxfixes -quiet
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
priority=30
autostart=true
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; DISPLAY must be set here: Playwright launches Chromium as a child of this
; process, and a headed browser with no DISPLAY fails to start.
[program:uvicorn]
command=/usr/local/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    --proxy-headers --forwarded-allow-ips=*
directory=/app/backend
environment=DISPLAY=":99",PYTHONPATH="/app/backend",PYTHONUNBUFFERED="1"
priority=40
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
