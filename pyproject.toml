[project]
name = "smart-job-apply"
version = "0.1.0"
description = "AI-powered career application assistant: finds jobs, scores them against your resume and fills the application form for you to review and approve."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "anthropic>=0.40",
    # Transport for every OpenAI-compatible provider (ollama, groq, gemini,
    # openrouter, cerebras). Runtime, not just test-time, since those are the
    # providers that let the app run without a paid key.
    "httpx>=0.28",
    "playwright>=1.49,<2",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "aiosqlite>=0.20",
    # [email] pulls in email-validator, which EmailStr needs at schema build time.
    "pydantic[email]>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-jose[cryptography]>=3.3",
    # bcrypt is used directly. passlib 1.7.4 (unmaintained since 2020) cannot read
    # the version of bcrypt >= 4.1 and its backend probe fails outright on bcrypt 5.
    "bcrypt>=4.1",
    "cryptography>=44",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.20",
    "PyYAML>=6.0",
    # Extracts the resume text from an uploaded PDF so the AI has something to read
    # without the user retyping it. Optional at runtime: a missing parser only means
    # the text field is left for the user to fill in.
    "pypdf>=5.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest-cov>=6.0",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Without this, ruff cannot resolve `app` as first-party and isort reorders every
# `from app...` import above the third-party block.
src = ["backend"]
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "e2e: drives a real Chromium against the fake portal (needs `playwright install chromium`)",
]
# The browser tests are opt-in: they need a browser binary and take seconds each,
# so `make test` stays fast and runnable on a bare checkout. `make e2e` runs them
# with `-m e2e`, and `make test-all` runs everything.
addopts = "-m 'not e2e'"

[tool.coverage.run]
source = ["backend/app"]
branch = true
omit = [
    # Playwright drivers: nothing here executes without a real browser and a live
    # LinkedIn session, so measuring them only reports a floor that can never move.
    # Their behaviour is exercised by the fixture-based tests in backend/tests instead.
    "backend/app/automation/linkedin/*",
    "backend/app/automation/browser.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    # Protocol and overload bodies are declarations, not statements to execute.
    "^\\s*\\.\\.\\.$",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# Strict only where it is cheap to keep clean: modules that are new, pure or small.
# The rest of the package stays advisory while app/automation and app/services are
# being restructured; their pre-existing errors are a baseline, not a target.
[[tool.mypy.overrides]]
module = ["app.domain.*", "app.ai.port", "app.observability.*", "app.schemas.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
