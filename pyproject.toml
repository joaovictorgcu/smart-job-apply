[project]
name = "linkedin-auto-apply"
version = "0.1.0"
description = "Assistente de candidaturas no LinkedIn: busca vagas, avalia com IA e preenche a Candidatura Simplificada para você revisar e aprovar."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "anthropic>=0.40",
    "playwright>=1.49,<2",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "aiosqlite>=0.20",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-jose[cryptography]>=3.3",
    # bcrypt is used directly. passlib 1.7.4 (unmaintained since 2020) cannot read
    # the version of bcrypt >= 4.1 and its backend probe fails outright on bcrypt 5.
    "bcrypt>=4.1",
    "cryptography>=44",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.20",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Without this, ruff cannot resolve `app` as first-party and isort reorders every
# `from app...` import above the third-party block.
src = ["backend"]
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
