# Alembic configuration.
#
# Paths use %(here)s (the directory holding this file) so the commands work from
# any working directory:
#     alembic -c backend/alembic.ini upgrade head
#     cd backend && alembic upgrade head
#
# The database URL is NOT set here on purpose: env.py reads it from
# app.config.get_settings().resolved_database_url so that the migrations and the
# application can never disagree about which database they are talking to.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
version_path_separator = os

# Timestamped, slug-suffixed revision filenames keep `versions/` readable.
file_template = %%(rev)s_%%(slug)s

# Interpret naive timestamps in file_template as UTC.
timezone = UTC


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
